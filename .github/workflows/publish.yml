name: Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: README translation lock
        run: node scripts/check-readme-translations.mjs

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Integration tests (agent-modules CLI)
        run: npm test

  version-check:
    name: Check npm version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Determine if publish is needed
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "agent-modules@${VERSION}" version 2>/dev/null | grep -Fxq "$VERSION"; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "agent-modules@${VERSION} already on npm; skipping publish job."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "agent-modules@${VERSION} not on npm; publish will run after CI passes."
          fi

  publish:
    name: npm publish
    runs-on: ubuntu-latest
    needs: [readme, test, version-check]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.version-check.outputs.should_publish == 'true'
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --access public
